services:
  - type: web
    name: placementhub-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: BATCH_SIZE
        value: "53"
      - key: APP_NAME
        value: PlacementHub
      - key: SECRET_KEY
        generateValue: true
      # SendGrid Email — set these in Render Dashboard (keep secret)
      - key: SENDGRID_API_KEY
        sync: false
      # Your verified Gmail address (after Single Sender Verification on SendGrid)
      - key: SENDGRID_FROM_EMAIL
        sync: false
      # Your deployed frontend URL (e.g. https://placementhub.vercel.app)
      - key: FRONTEND_URL
        sync: false
      # Supabase — set these in Render Dashboard
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
