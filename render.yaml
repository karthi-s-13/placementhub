services:
  - type: web
    name: placementhub-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: BATCH_SIZE
        value: "53"
      - key: APP_NAME
        value: PlacementHub
      - key: SECRET_KEY
        generateValue: true
